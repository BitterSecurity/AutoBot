[project]
# PyPI distribution name — the bare ``autobot`` name is already taken on
# PyPI by an unrelated project, so the short namespace form is used. The
# import package remains ``autobot``.
name = "bs-autobot"
# Sentinel — replaced with the git tag at build time, in lockstep with the
# rest of the workspace. See containers/langgraph.Dockerfile and the
# release workflow.
version = "0.0.0"
description = "AutoBot: autonomous defensive security agent (detect -> investigate -> respond)"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.13"

authors = [
    { name = "BitterSecurity" }
]

keywords = [
    "ai", "security", "blue-team", "siem", "detection", "ocsf", "sigma",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]

# AutoBot is the defensive sibling of Decepticon (red). By design it depends
# ONLY on the shared contract layer ``decepticon-core`` — not the Decepticon
# framework runtime — so it installs and runs standalone (a defender need not
# pull in the offensive agent). Red/Blue are composed by Cybertron on top.
dependencies = [
    # AutoBot and Decepticon ship in lockstep (release policy §2) — the
    # contract layer is version-compatible by construction. Unpinned so the
    # co-installed Decepticon workspace's sentinel-versioned member satisfies
    # the requirement (uv rejects a 0.0.0 member against a >= floor).
    "decepticon-core",
    "pydantic>=2.0.0",
    # Agent runtime (Phase 2b-ii): the middleware stack is LangChain-native
    # (AgentMiddleware), matching the Decepticon agent architecture. The
    # blue_cell graph stays read-only — no bash, no mutating tools.
    "langchain-core>=0.3.0",
    "langchain>=0.3.0",
    "langgraph>=1.0.0",
    "langchain-openai>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "deepagents>=0.3.0",
    "httpx>=0.28.0",
    "typing-extensions>=4.0.0",
]

[project.optional-dependencies]
# OpenSearch event store (the default substrate) — opensearch-py is imported
# lazily inside ``autobot.stores.opensearch_store`` so ``pip install autobot``
# stays lean. Each store backend is independently installable; there is no
# "install everything" bundle. External backends (e.g. autobot-store-clickhouse)
# ship as their own packages and register under ``decepticon.event_stores``.
opensearch = ["opensearch-py>=2,<4"]
testing = ["pytest>=8.0.0"]

# AutoBot's in-tree event-store backends, selected by name via
# ``autobot.stores.get_event_store`` and discoverable by the framework when
# ``autobot`` is installed alongside it (``decepticon[blue]``).
[project.entry-points."decepticon.event_stores"]
opensearch = "autobot.stores.opensearch_store:OpenSearchEventStore"

# Trusted client admission metadata; the agent owns its read-only middleware.
[project.entry-points."decepticon.roles"]
autobot = "autobot.role:ROLE_SPEC"

# The optional AutoBot graph is discovered without in-tree Blue implementations.
[project.entry-points."decepticon.agents"]
autobot = "autobot.agent.autobot:graph"

# The red orchestrator dispatches blue_cell as a subagent when this package
# is installed (``decepticon[blue]``) — the purple loop's defender side.
[project.entry-points."decepticon.subagents"]
autobot = "autobot.agent.autobot:SUBAGENT_SPEC"

[project.urls]
Homepage = "https://github.com/BitterSecurity/AutoBot"
Repository = "https://github.com/BitterSecurity/AutoBot"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["autobot"]
