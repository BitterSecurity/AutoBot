[project]
name = "autobot"
# Sentinel — replaced with the git tag at build time, in lockstep with the
# rest of the workspace. See containers/langgraph.Dockerfile and the
# release workflow.
version = "0.0.0"
description = "AutoBot: autonomous defensive security agent (detect -> investigate -> respond)"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.13"

authors = [
    { name = "BitterSecurity" }
]

keywords = [
    "ai", "security", "blue-team", "siem", "detection", "ocsf", "sigma",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]

# AutoBot is the defensive sibling of Decepticon (red). By design it depends
# ONLY on the shared contract layer ``decepticon-core`` — not the Decepticon
# framework runtime — so it installs and runs standalone (a defender need not
# pull in the offensive agent). Red/Blue are composed by Cybertron on top.
dependencies = [
    # The contract layer (OCSF event, EventStoreProtocol, CoverageAdapterProtocol)
    # merged on main is NOT yet on PyPI (the 2.0.0 release predates it), so the
    # bootstrap pins a git revision. Flip back to the PyPI dependency once
    # decepticon-core ships a release containing the contracts.
    "decepticon-core @ git+https://github.com/BitterSecurity/Decepticon@6243c51640aed28fd68834d05e728f634eb40855#subdirectory=packages/decepticon-core",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
# OpenSearch event store (the default substrate) — opensearch-py is imported
# lazily inside ``autobot.stores.opensearch_store`` so ``pip install autobot``
# stays lean. Each store backend is independently installable; there is no
# "install everything" bundle. External backends (e.g. autobot-store-clickhouse)
# ship as their own packages and register under ``decepticon.event_stores``.
opensearch = ["opensearch-py>=2,<4"]
testing = ["pytest>=8.0.0"]

# AutoBot's in-tree event-store backends, selected by name via
# ``autobot.stores.get_event_store`` and discoverable by the framework when
# ``autobot`` is installed alongside it (``decepticon[blue]``).
[project.entry-points."decepticon.event_stores"]
opensearch = "autobot.stores.opensearch_store:OpenSearchEventStore"

[project.urls]
Homepage = "https://github.com/BitterSecurity/AutoBot"
Repository = "https://github.com/BitterSecurity/AutoBot"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
# The bootstrap pins decepticon-core to a git revision (the contract layer is
# not yet on PyPI); hatchling rejects direct references by default.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["autobot"]
