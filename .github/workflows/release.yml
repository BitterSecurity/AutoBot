name: Release

# Tag-triggered: build the bs-autobot wheel and publish to PyPI via Trusted
# Publishing (OIDC). First-time setup on pypi.org (maintainer action):
#   Pending Publisher: repo BitterSecurity/AutoBot, workflow release.yml,
#   environment pypi-release — then the publish job is authorized.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publish-pypi:
    name: Publish bs-autobot wheel to PyPI
    runs-on: ubuntu-latest
    environment: pypi-release
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Stamp the package version from the tag
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          sed -i 's/^version = "0.0.0"/version = "'"$VERSION"'"/' packages/autobot/pyproject.toml
      - run: uv build --package bs-autobot
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: GitHub Release
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Extract release notes from the tag annotation
        run: |
          git tag -l --format='%(contents)' "${GITHUB_REF#refs/tags/}" > RELEASE_NOTES.md
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          draft: false
