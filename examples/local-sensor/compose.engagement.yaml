# Overlay that the CLI adds when running the Blue sensor under an engagement:
#   /blue engagement create ... && /blue up
# It bind-mounts the Blue-owned workspace root read-only so the monitor can
# load the reviewed rules file (BLUE_RULES_FILE points at
# /blue-engagement/<rules_file>). The workspace root stays outside the Red
# engagement workspace; the mount is read-only, so the sensor can never
# modify the reviewed configuration.
services:
  blue-monitor:
    volumes:
      - ${BLUE_ENGAGEMENT_DIR:?BLUE_ENGAGEMENT_DIR is required for engagement runs}:/blue-engagement:ro