# Overlay that loads operator detection rules into the Blue monitor:
#   docker compose --profile fixture -f compose.yaml -f compose.rules.yaml up -d
# Edit ./rules/sample-web-rules.jsonl or replace it; each line follows the
# bootstrap / Sigma-ish subset that decepticon.blue_cell.rule_match accepts
# ({"id", "level", "match": {field: pattern}} or
# {"selections": {...}, "condition": "a and not b"}; "re:" prefixes a regex,
# otherwise the value matches as a case-insensitive substring). Dotted fields
# resolve into the sensor event; "uri" is URL-decoded and "request_body" holds
# the stored body when one exists. BLUE_RULES_FILE set but unreadable stops
# the monitor on purpose, so a broken rules file never silently disables the
# rules you configured.
services:
  blue-monitor:
    environment:
      BLUE_RULES_FILE: ${BLUE_RULES_FILE:-/app/rules/sample-web-rules.jsonl}
    volumes:
      - ./rules:/app/rules:ro
